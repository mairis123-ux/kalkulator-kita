<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Kita</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }
        .calculator {
            background-color: #1e222b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 320px;
        }
        .display {
            background-color: #282c34;
            color: #ffffff;
            text-align: right;
            padding: 20px;
            font-size: 2rem;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 80px;
            word-wrap: break-word;
            word-break: break-all;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 18px;
            font-size: 1.25rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background-color: #3e4451;
            color: white;
            transition: background-color 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        button.operator {
            background-color: #ff9f0a;
            color: white;
        }
        button.clear {
            background-color: #acb1b6;
            color: black;
        }
        button.equal {
            background-color: #28a745;
            color: white;
            grid-column: span 1;
        }
        .status-text {
            color: #55b681;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 15px;
            min-height: 15px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="appendCharacter('(')">(</button>
        <button onclick="appendCharacter(')')">)</button>
        <button class="operator" onclick="appendCharacter('/')">÷</button>
        
        <button onclick="appendCharacter('7')">7</button>
        <button onclick="appendCharacter('8')">8</button>
        <button onclick="appendCharacter('9')">9</button>
        <button class="operator" onclick="appendCharacter('*')">×</button>
        
        <button onclick="appendCharacter('4')">4</button>
        <button onclick="appendCharacter('5')">5</button>
        <button onclick="appendCharacter('6')">6</button>
        <button class="operator" onclick="appendCharacter('-')">-</button>
        
        <button onclick="appendCharacter('1')">1</button>
        <button onclick="appendCharacter('2')">2</button>
        <button onclick="appendCharacter('3')">3</button>
        <button class="operator" onclick="appendCharacter('+')">+</button>
        
        <button onclick="appendCharacter('0')">0</button>
        <button onclick="appendCharacter('.')">,</button>
        <button class="equal" style="grid-column: span 2; width: 100%;" onclick="calculateResult()">=</button>
    </div>
    <div class="status-text" id="status"></div>
</div>

<script>
    // PENTING: Ganti tulisan di bawah ini dengan URL Web App dari Google Apps Script Anda yang berakhiran /exec
    const URL_GOOGLE_WEBAPP = "https://script.google.com/macros/s/AKfycbwQtCzLJMVoG9IiqpriWXo93u98nK8hsKdDmdxbA6L8rtIlXx2Yh2CID49-ms3YGekg/exec";

    let displayElement = document.getElementById('display');
    let statusElement = document.getElementById('status');
    let currentInput = '';

    function appendCharacter(char) {
        if (displayElement.innerText === '0' && !isNaN(char)) {
            currentInput = char;
        } else {
            currentInput += char;
        }
        displayElement.innerText = currentInput;
    }

    function clearDisplay() {
        currentInput = '';
        displayElement.innerText = '0';
        statusElement.innerText = '';
    }

    function calculateResult() {
        try {
            if (currentInput === '') return;
            
            let formula = currentInput;
            // Menghitung hasil matematika secara aman
            let hasil = eval(formula.replace(/×/g, '*').replace(/÷/g, '/'));
            
            displayElement.innerText = hasil;
            
            // Format visual tampilan agar rapi saat dikirim ke Google Sheets
            let formulaTampilan = formula.replace(/\*/g, '×').replace(/\//g, '÷');
            
            // Kirim data secara otomatis ke database Google Sheets
            kirimKeGoogleSheet(formulaTampilan, hasil);
            
            currentInput = hasil.toString();
        } catch (error) {
            displayElement.innerText = 'Error';
            currentInput = '';
        }
    }

    function kirimKeGoogleSheet(formula, hasil) {
        statusElement.style.color = "#ff9f0a";
        statusElement.innerText = "Menyimpan ke Google Sheet...";

        if (URL_GOOGLE_WEBAPP === "https://script.google.com/macros/s/AKfycbwQtCzLJMVoG9IiqpriWXo93u98nK8hsKdDmdxbA6L8rtIlXx2Yh2CID49-ms3YGekg/exec") {
            statusElement.style.color = "#red";
            statusElement.innerText = "Gagal: URL Web App Google belum diisi!";
            return;
        }

        fetch(URL_GOOGLE_WEBAPP, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                formula: formula,
                result: hasil
            })
        })
        .then(response => response.json())
        .then(data => {
            if(data.success) {
                statusElement.style.color = "#55b681";
                statusElement.innerText = "✓ Riwayat berhasil disimpan!";
            } else {
                statusElement.style.color = "#ff4a4a";
                statusElement.innerText = "Gagal menyimpan: " + data.error;
            }
        })
        .catch(error => {
            statusElement.style.color = "#ff4a4a";
            statusElement.innerText = "Terjadi kesalahan jaringan!";
            console.error(error);
        });
    }
</script>
</body>
</html>
