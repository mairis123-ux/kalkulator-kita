<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Kita</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    /* Container Aplikasi / Standar HP di PC */
    .calculator-container {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 840px;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    @media (min-width: 480px) {
      .calculator-container {
        height: 90vh;
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid #2a2a2a;
      }
    }

    /* Area Display / Layar */
    .display-container {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      word-break: break-all;
      word-wrap: break-word;
      min-height: 180px;
      flex-grow: 1;
    }

    .expression-display {
      font-size: 1.4rem;
      color: #a5a5a5;
      min-height: 32px;
      margin-bottom: 8px;
      text-align: right;
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
    }

    .result-display {
      font-size: 3rem;
      font-weight: 600;
      color: #ffffff;
      text-align: right;
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
    }

    /* Grid Keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background-color: #2a2a2a; /* Garis pembatas tipis antar tombol */
      border-top: 1px solid #2a2a2a;
    }

    .btn {
      background-color: #1e1e1e;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 1.5rem;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn:active {
      background-color: #333333;
    }

    /* Warna Tombol Spesifik */
    .btn-operator {
      color: #29b6f6; /* Warna aksen biru lembut */
    }

    .btn-clear {
      color: #ff5252; /* Warna merah aksen untuk C */
    }

    .btn-equals {
      background-color: #0288d1;
      color: #ffffff;
    }

    .btn-equals:active {
      background-color: #039be5;
    }

    /* Responsive adjustment untuk layar kecil */
    @media (max-height: 670px) {
      .btn {
        height: 65px;
        font-size: 1.3rem;
      }
      .result-display {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="calculator-container">
    <!-- Display -->
    <div class="display-container">
      <div id="expression" class="expression-display"></div>
      <div id="result" class="result-display">0</div>
    </div>

    <!-- Keypad -->
    <div class="keypad">
      <!-- Baris 1 -->
      <button class="btn btn-clear" onclick="clearAll()">C</button>
      <button class="btn btn-operator" onclick="appendOperator('%')">%</button>
      <button class="btn btn-operator" onclick="backspace()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
          <line x1="18" y1="9" x2="12" y2="15"></line>
          <line x1="12" y1="9" x2="18" y2="15"></line>
        </svg>
      </button>
      <button class="btn btn-operator" onclick="appendOperator('÷')">÷</button>

      <!-- Baris 2 -->
      <button class="btn" onclick="appendNumber('7')">7</button>
      <button class="btn" onclick="appendNumber('8')">8</button>
      <button class="btn" onclick="appendNumber('9')">9</button>
      <button class="btn btn-operator" onclick="appendOperator('×')">×</button>

      <!-- Baris 3 -->
      <button class="btn" onclick="appendNumber('4')">4</button>
      <button class="btn" onclick="appendNumber('5')">5</button>
      <button class="btn" onclick="appendNumber('6')">6</button>
      <button class="btn btn-operator" onclick="appendOperator('-')">-</button>

      <!-- Baris 4 -->
      <button class="btn" onclick="appendNumber('1')">1</button>
      <button class="btn" onclick="appendNumber('2')">2</button>
      <button class="btn" onclick="appendNumber('3')">3</button>
      <button class="btn btn-operator" onclick="appendOperator('+')">+</button>

      <!-- Baris 5 -->
      <button class="btn" onclick="toggleSign()">+/-</button>
      <button class="btn" onclick="appendNumber('0')">0</button>
      <button class="btn" onclick="appendNumber('.')">,</button>
      <button class="btn btn-equals" onclick="calculateResult()">=</button>
    </div>
  </div>

  <script>
    let currentInput = '';
    let currentNumber = '0';
    let isEvaluated = false;

    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');

    function updateDisplay() {
      expressionEl.textContent = currentInput;
      resultEl.textContent = formatNumber(currentNumber);
    }

    function appendNumber(num) {
      if (isEvaluated) {
        currentInput = '';
        currentNumber = '0';
        isEvaluated = false;
      }

      if (num === '.') {
        if (currentNumber.includes('.')) return;
        if (currentNumber === '' || currentNumber === '0') {
          currentNumber = '0.';
          currentInput += (currentInput === '' ? '0.' : '.');
        } else {
          currentNumber += '.';
          currentInput += '.';
        }
      } else {
        if (currentNumber === '0') {
          currentNumber = num;
        } else {
          currentNumber += num;
        }
        currentInput += num;
      }

      updateDisplay();
    }

    function appendOperator(op) {
      if (currentInput === '' && op !== '-') return;

      if (isEvaluated) {
        isEvaluated = false;
      }

      const lastChar = currentInput.slice(-1);
      if (['+', '-', '×', '÷', '%'].includes(lastChar)) {
        currentInput = currentInput.slice(0, -1) + op;
      } else {
        currentInput += op;
      }

      currentNumber = '0';
      updateDisplay();
    }

    function clearAll() {
      currentInput = '';
      currentNumber = '0';
      isEvaluated = false;
      expressionEl.textContent = '';
      resultEl.textContent = '0';
    }

    function backspace() {
      if (isEvaluated) {
        clearAll();
        return;
      }

      if (currentInput.length > 0) {
        const removedChar = currentInput.slice(-1);
        currentInput = currentInput.slice(0, -1);

        if (['+', '-', '×', '÷', '%'].includes(removedChar)) {
          // Jika menghapus operator, ambil angka sebelum operator tersebut
          const tokens = currentInput.split(/[\+\-\×\÷]/);
          currentNumber = tokens[tokens.length - 1] || '0';
        } else {
          if (currentNumber.length > 1) {
            currentNumber = currentNumber.slice(0, -1);
          } else {
            currentNumber = '0';
          }
        }
      }
      updateDisplay();
    }

    function toggleSign() {
      if (!currentInput) return;

      const match = currentInput.match(/(.*?)([\d\.]+)$/);
      if (match) {
        const prefix = match[1];
        const num = match[2];

        if (prefix.endsWith('-')) {
          const basePrefix = prefix.slice(0, -1);
          const lastBaseChar = basePrefix.slice(-1);
          if (['+', '×', '÷'].includes(lastBaseChar)) {
            currentInput = basePrefix + num;
          } else {
            currentInput = basePrefix + '+' + num;
          }
        } else if (prefix.endsWith('+')) {
          currentInput = prefix.slice(0, -1) + '-' + num;
        } else {
          currentInput = prefix + '-' + num;
        }

        currentNumber = (parseFloat(num) * -1).toString();
        updateDisplay();
      }
    }

    // Perhitungan kalkulasi matematika
    function computeExpression(expr) {
      try {
        if (!expr) return null;

        let formatted = expr.replace(/×/g, '*').replace(/÷/g, '/');

        // Handling persentase finansial
        formatted = formatted.replace(/(.+?)([\+\-])\s*([\d\.]+)\%/g, (match, baseExpr, op, percentVal) => {
          return `${baseExpr}${op}((${baseExpr}) * (${percentVal} / 100))`;
        });

        // Persentase sederhana
        formatted = formatted.replace(/([\d\.]+)\%/g, '($1/100)');

        const result = Function(`'use strict'; return (${formatted})`)();
        return Math.round(result * 1e10) / 1e10;
      } catch (e) {
        return null;
      }
    }

    // DISEKUTAN SAAT TOMBOL SAMA DENGAN (=) DIPENCET
    function calculateResult() {
      if (!currentInput) return;

      const finalResult = computeExpression(currentInput);

      if (finalResult !== null && !isNaN(finalResult)) {
        const rawFormula = currentInput;
        const rawResult = finalResult;

        // Tampilkan Formula di Atas dan Hasil Akhir di Bawah
        expressionEl.textContent = currentInput + ' =';
        resultEl.textContent = formatNumber(finalResult);

        isEvaluated = true;
        currentInput = finalResult.toString();
        currentNumber = finalResult.toString();

        // Kirim hasil ke Google Sheets
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(response) {
              console.log('Berhasil disimpan ke Sheet:', response);
            })
            .withFailureHandler(function(error) {
              console.error('Gagal menyimpan ke Sheet:', error);
            })
            .saveHistory(rawFormula, rawResult);
        }

      } else {
        resultEl.textContent = 'Error';
      }
    }

    function formatNumber(num) {
      if (num === 'Error' || num === '' || num === null) return num;
      const str = num.toString();
      const parts = str.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return parts.join('.');
    }
  </script>
</body>
</html>
